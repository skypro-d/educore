
name: EduCore Automated Release & Live Server Distribution

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. 1.0.2)'
        required: true
        default: '1.0.2'

      channel:
        description: 'Release Channel'
        required: true
        type: choice
        options:
          - stable
          - beta
          - canary
        default: 'stable'

      mandatory:
        description: 'Flag as mandatory security update'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Verify, Sign & Distribute Release
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. PHP
      # ---------------------------------------------------------
      - name: Setup PHP 8.3 Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, curl, openssl, json, mbstring, gd, zip
          coverage: none

      # ---------------------------------------------------------
      # 3. PHP SYNTAX CHECK
      # ---------------------------------------------------------
      - name: Syntax Linting & Verification
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EduCore PHP Syntax Verification"
          echo "======================================"

          find . \
            -type f \
            -name "*.php" \
            ! -path "./storage/*" \
            ! -path "./uploads/*" \
            ! -path "./vendor/*" \
            -print0 |
          xargs -0 -n 1 -P 4 php -l

          echo ""
          echo "PHP syntax verification completed successfully."

      # ---------------------------------------------------------
      # 4. EXTRACT VERSION / BUILD METADATA
      # ---------------------------------------------------------
      - name: Extract Version & Build Metadata
        id: vars
        shell: bash
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
            CHANNEL="${{ github.event.inputs.channel }}"
            MANDATORY="${{ github.event.inputs.mandatory }}"
          else
            RAW_VER="${GITHUB_REF_NAME#v}"
            CHANNEL="stable"
            MANDATORY="false"
          fi

          # Validate semantic version format
          if ! [[ "$RAW_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Invalid version: $RAW_VER"
            echo "Expected format: 1.0.0 or 1.0.0-beta.1"
            exit 1
          fi

          echo "VERSION=${RAW_VER}" >> "$GITHUB_OUTPUT"
          echo "CHANNEL=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "MANDATORY=${MANDATORY}" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_NAME=EduCore-v${RAW_VER}.zip" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Version: ${RAW_VER}"
          echo "Channel: ${CHANNEL}"
          echo "Mandatory: ${MANDATORY}"

      # ---------------------------------------------------------
      # 5. PREPARE DISTRIBUTION PACKAGE
      # ---------------------------------------------------------
      - name: Prepare Clean Distribution Package
        shell: bash
        run: |
          set -e

          PKG_NAME="${{ steps.vars.outputs.PACKAGE_NAME }}"

          echo "======================================"
          echo "Preparing EduCore Distribution"
          echo "======================================"

          mkdir -p build_tmp

          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.env' \
            --exclude 'uploads/*' \
            --exclude 'logs/*' \
            --exclude 'storage/backups/*' \
            --exclude 'storage/updates/*' \
            --exclude 'config/cache/*' \
            --exclude 'tests' \
            --exclude 'scratch' \
            --exclude 'install/installation.lock' \
            --exclude 'build_tmp' \
            --exclude '*.zip' \
            ./ build_tmp/

          cat << 'EOF' > build_tmp/version.php
          <?php
          declare(strict_types=1);

          if (!defined('EDUCORE_VERSION')) {
              define('EDUCORE_VERSION', '${{ steps.vars.outputs.VERSION }}');
          }

          if (!defined('EDUCORE_BUILD')) {
              define('EDUCORE_BUILD', date('Ymd.His'));
          }

          if (!defined('EDUCORE_MIN_PHP')) {
              define('EDUCORE_MIN_PHP', '8.3.0');
          }

          if (!defined('EDUCORE_MIN_MYSQL')) {
              define('EDUCORE_MIN_MYSQL', '8.0.0');
          }

          if (!defined('EDUCORE_DEFAULT_CHANNEL')) {
              define('EDUCORE_DEFAULT_CHANNEL', '${{ steps.vars.outputs.CHANNEL }}');
          }
          EOF

          cd build_tmp

          zip -r "../${PKG_NAME}" . \
            -x "*.git*" \
            -x "*storage/backups/*" \
            -x "*storage/updates/*"

          cd ..

          rm -rf build_tmp

          echo ""
          echo "Package created:"
          ls -lh "${PKG_NAME}"

      # ---------------------------------------------------------
      # 6. SHA256 + SIGNATURE
      # ---------------------------------------------------------
      - name: Compute Cryptographic SHA256 & Signature
        id: crypto
        shell: bash
        env:
          SIGNING_SECRET: ${{ secrets.SKYSAVING_SECRET_KEY }}
        run: |
          set -e

          PKG_NAME="${{ steps.vars.outputs.PACKAGE_NAME }}"

          SHA256_HASH=$(sha256sum "${PKG_NAME}" | awk '{print $1}')

          echo "SHA256=${SHA256_HASH}" >> "$GITHUB_OUTPUT"

          echo "Package SHA256:"
          echo "${SHA256_HASH}"

          if [ -z "${SIGNING_SECRET}" ]; then
            echo "::error ::SKYSAVING_SECRET_KEY is not set in GitHub repository secrets."
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          SECRET_KEY="${SIGNING_SECRET}"

          VERSION="${{ steps.vars.outputs.VERSION }}"

          SIGNATURE=$(SECRET_KEY="${SECRET_KEY}" VERSION="${VERSION}" SHA256_HASH="${SHA256_HASH}" php -r '
            $secret = getenv("SECRET_KEY");
            $version = getenv("VERSION");
            $sha256 = getenv("SHA256_HASH");

            echo hash_hmac(
                "sha256",
                $version . $sha256,
                $secret
            );
          ')

          echo "SIGNATURE=${SIGNATURE}" >> "$GITHUB_OUTPUT"

          echo "Cryptographic signature generated successfully."

      # ---------------------------------------------------------
      # 7. CREATE GITHUB RELEASE
      # ---------------------------------------------------------
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.vars.outputs.VERSION) || github.ref_name }}
          name: EduCore v${{ steps.vars.outputs.VERSION }}
          body: |
            ## EduCore Software Release v${{ steps.vars.outputs.VERSION }}

            **Release Channel:** `${{ steps.vars.outputs.CHANNEL }}`
            **Minimum PHP:** `8.3.0+`
            **Minimum MySQL:** `8.0.0+`
            **Mandatory Upgrade:** `${{ steps.vars.outputs.MANDATORY }}`

            ### Package Verification

            - **Package:** `${{ steps.vars.outputs.PACKAGE_NAME }}`
            - **SHA256 Checksum:** `${{ steps.crypto.outputs.SHA256 }}`
            - **Digital Signature:** `${{ steps.crypto.outputs.SIGNATURE }}`

            ### Automatic Fleet Distribution

            Connected EduCore school installations can receive release notifications from the EduCore Live Server.

            Schools can then upgrade through the EduCore Admin Dashboard or their scheduled update process.

            ### Release Information

            This release was automatically built and verified by GitHub Actions.
          files: |
            ${{ steps.vars.outputs.PACKAGE_NAME }}
          draft: false
          prerelease: ${{ steps.vars.outputs.CHANNEL != 'stable' }}

      # ---------------------------------------------------------
      # 8. REGISTER RELEASE WITH EDUCORE LIVE SERVER
      # ---------------------------------------------------------
      - name: Register Release on EduCore Live Server
        env:
          EDUCORE_LIVE_URL: ${{ secrets.EDUCORE_LIVE_URL }}
          ADMIN_TOKEN: ${{ secrets.SKYSAVING_SECRET_KEY }}
          VERSION: ${{ steps.vars.outputs.VERSION }}
          PACKAGE_NAME: ${{ steps.vars.outputs.PACKAGE_NAME }}
          SHA256: ${{ steps.crypto.outputs.SHA256 }}
          SIGNATURE: ${{ steps.crypto.outputs.SIGNATURE }}
          CHANNEL: ${{ steps.vars.outputs.CHANNEL }}
          MANDATORY: ${{ steps.vars.outputs.MANDATORY }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -e

          # ── Validate required secrets ──────────────────────────────────────
          if [ -z "${EDUCORE_LIVE_URL}" ]; then
            echo "::error ::EDUCORE_LIVE_URL secret is not set in GitHub repository secrets."
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          if [ -z "${ADMIN_TOKEN}" ]; then
            echo "::error ::SKYSAVING_SECRET_KEY secret is not set in GitHub repository secrets."
            echo "Go to: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

          LIVE_URL="${EDUCORE_LIVE_URL}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            RELEASE_TAG="v${VERSION}"
          else
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${PACKAGE_NAME}"

          if [ "${MANDATORY}" = "true" ]; then
            MANDATORY_VALUE=1
          else
            MANDATORY_VALUE=0
          fi

          # ── Normalize Base URL (strip trailing slashes safely) ─────────────
          RAW_URL=$(echo "${EDUCORE_LIVE_URL}" | xargs)
          BASE_URL="${RAW_URL%/}"
          while [[ "${BASE_URL}" == */ ]]; do
            BASE_URL="${BASE_URL%/}"
          done

          # ── Validate URL Scheme & Structure ────────────────────────────────
          if [[ ! "${BASE_URL}" =~ ^https?://[a-zA-Z0-9.-]+ ]]; then
            echo "::error ::Invalid EDUCORE_LIVE_URL format: '${BASE_URL}'. Must begin with https:// (or http://) followed by a valid host."
            exit 1
          fi

          if [[ "${BASE_URL}" =~ ^http:// ]]; then
            echo "::warning ::EDUCORE_LIVE_URL uses unencrypted HTTP. HTTPS is strongly recommended for transmitting Authorization Bearer tokens in production."
          fi

          # ── Extract Target Host for DNS diagnostics (pure bash) ────────────
          HOST_PART="${BASE_URL#*://}"
          HOST_PART="${HOST_PART%%/*}"
          TARGET_HOST="${HOST_PART%%:*}"

          # ── Construct Registration & Health-Check Endpoints ────────────────
          REGISTER_URL="${BASE_URL}/index.php?route=api/v1/releases/register"
          CHECK_URL="${BASE_URL}/index.php?route=api/v1/updates/check&release_channel=stable"

          echo "======================================"
          echo "Registering Release with EduCore Live"
          echo "======================================"
          echo "Version:     ${VERSION}"
          echo "Channel:     ${CHANNEL}"
          echo "Mandatory:   ${MANDATORY_VALUE}"
          echo "SHA256:      ${SHA256}"
          echo "Download:    ${DOWNLOAD_URL}"
          echo "Base URL:    ${BASE_URL}"
          echo "Target Host: ${TARGET_HOST}"
          echo "Target URL:  ${REGISTER_URL}"
          echo "======================================"

          # ── Pre-registration Connectivity & Health Check ───────────────────
          echo "Testing connectivity to live server (${TARGET_HOST})..."
          HEALTH_OUT=$(mktemp)
          HEALTH_ERR=$(mktemp)
          set +e
          curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 30 \
            --output "${HEALTH_OUT}" \
            "${CHECK_URL}" \
            2> "${HEALTH_ERR}"
          HEALTH_EXIT=$?
          set -e

          HEALTH_BODY=$(cat "${HEALTH_OUT}" 2>/dev/null || echo "")
          HEALTH_ERR_MSG=$(cat "${HEALTH_ERR}" 2>/dev/null || echo "")
          rm -f "${HEALTH_OUT}" "${HEALTH_ERR}"

          if [ ${HEALTH_EXIT} -ne 0 ]; then
            echo "::error ::Live server connectivity check failed (curl exit code ${HEALTH_EXIT}) for host '${TARGET_HOST}'."
            if [ -n "${HEALTH_ERR_MSG}" ]; then
              echo "::error ::curl error: ${HEALTH_ERR_MSG}"
            fi
            exit 1
          fi
          echo "Connectivity check passed (HTTP connection to ${TARGET_HOST} verified)."

          # ── Build JSON payload ─────────────────────────────────────────────
          PAYLOAD=$(VERSION="${VERSION}" DOWNLOAD_URL="${DOWNLOAD_URL}" PACKAGE_NAME="${PACKAGE_NAME}" SHA256="${SHA256}" SIGNATURE="${SIGNATURE}" CHANNEL="${CHANNEL}" MANDATORY_VALUE="${MANDATORY_VALUE}" php -r '
            $data = [
                "version"           => ltrim(getenv("VERSION"), "v"),
                "download_url"      => getenv("DOWNLOAD_URL"),
                "download_file"     => getenv("PACKAGE_NAME"),
                "sha256"            => getenv("SHA256"),
                "signature"         => getenv("SIGNATURE"),
                "release_channel"   => getenv("CHANNEL"),
                "mandatory"         => (int) getenv("MANDATORY_VALUE"),
                "min_php_version"   => "8.3.0",
                "min_mysql_version" => "8.0.0",
                "release_notes"     => "Automated build and release via GitHub Actions."
            ];
            echo json_encode($data, JSON_UNESCAPED_SLASHES);
          ')

          # ── Execute Registration Request ───────────────────────────────────
          CURL_OUT=$(mktemp)
          CURL_ERR=$(mktemp)

          set +e
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --request POST \
            "${REGISTER_URL}" \
            --header "Authorization: Bearer ${ADMIN_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${PAYLOAD}" \
            --write-out "%{http_code}" \
            --output "${CURL_OUT}" \
            2> "${CURL_ERR}"
          )
          CURL_EXIT_CODE=$?
          set -e

          HTTP_BODY=$(cat "${CURL_OUT}" 2>/dev/null || echo "")
          CURL_ERROR_MSG=$(cat "${CURL_ERR}" 2>/dev/null || echo "")
          rm -f "${CURL_OUT}" "${CURL_ERR}"

          echo ""
          echo "Live Server Response (HTTP ${HTTP_STATUS}, curl exit: ${CURL_EXIT_CODE}):"
          if [ -n "${CURL_ERROR_MSG}" ]; then
            echo "curl notice/error: ${CURL_ERROR_MSG}"
          fi
          echo "${HTTP_BODY}"

          # ── Robust JSON response validation ────────────────────────────────
          HTTP_BODY="${HTTP_BODY}" \
          HTTP_STATUS="${HTTP_STATUS}" \
          CURL_EXIT_CODE="${CURL_EXIT_CODE}" \
          CURL_ERROR_MSG="${CURL_ERROR_MSG}" \
          VERSION="${VERSION}" \
          SHA256="${SHA256}" \
          CHANNEL="${CHANNEL}" \
          php -r '
            $raw = getenv("HTTP_BODY");
            $httpStatus = (int)getenv("HTTP_STATUS");
            $curlExit = (int)getenv("CURL_EXIT_CODE");
            $curlErr = getenv("CURL_ERROR_MSG");
            $expectedVersion = ltrim(getenv("VERSION"), "v");
            $expectedSha256 = strtolower(getenv("SHA256"));
            $expectedChannel = getenv("CHANNEL");

            if ($curlExit !== 0 || $httpStatus === 0) {
                fwrite(STDERR, "::error ::Network connection to live server failed (HTTP {$httpStatus}, curl exit code {$curlExit}): {$curlErr}\n");
                exit(1);
            }

            $data = json_decode($raw, true);
            if (!is_array($data)) {
                fwrite(STDERR, "::error ::Live server returned non-JSON response (HTTP {$httpStatus}): " . substr($raw, 0, 300) . "\n");
                exit(1);
            }

            $isSuccess = ($data["success"] ?? false) === true || ($data["status"] ?? "") === "success";
            $isDuplicate = ($httpStatus === 409) || ($data["already_registered"] ?? false) || str_contains(strtolower($data["message"] ?? ""), "already exists") || str_contains(strtolower($data["message"] ?? ""), "already registered");

            if (!$isSuccess && !$isDuplicate) {
                $err = $data["message"] ?? "Registration rejected by live server.";
                fwrite(STDERR, "::error ::Registration failed: {$err} (HTTP {$httpStatus})\n");
                exit(1);
            }

            // Validate version
            if (isset($data["version"])) {
                $returnedVersion = ltrim((string)$data["version"], "v");
                if ($returnedVersion !== $expectedVersion) {
                    fwrite(STDERR, "::error ::Returned version mismatch. Expected: {$expectedVersion}, Got: {$returnedVersion}\n");
                    exit(1);
                }
            }

            // Validate SHA256
            if (isset($data["sha256"]) && !empty($data["sha256"])) {
                $returnedSha256 = strtolower((string)$data["sha256"]);
                if ($returnedSha256 !== $expectedSha256) {
                    fwrite(STDERR, "::error ::Returned SHA256 mismatch. Expected: {$expectedSha256}, Got: {$returnedSha256}\n");
                    exit(1);
                }
            }

            if ($isDuplicate && !$isSuccess) {
                echo "NOTICE: Release v{$expectedVersion} was already registered on the server.\n";
            }
            exit(0);
          '

          echo ""
          echo "======================================"
          echo "Release successfully registered."
          echo "Version: ${VERSION}"
          echo "Channel: ${CHANNEL}"
          echo "SHA256:  ${SHA256}"
          echo "======================================"

